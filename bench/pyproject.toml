[project]
name = "kairo-bench"
version = "0.1.0"
description = "Kairo-30: coding agents against real bugs from production AI infrastructure"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kairo-bench = "kairo_bench.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairo_bench"]
