# Coding agents the harness can run. Every CLI is installed into one pinned
# toolbox image (agents/toolbox.Dockerfile) and mounted read-only into each task
# container at /opt/kairo-agents.
#
# Select agents on the command line as NAME or NAME:MODEL, for example
#   kairo-bench run --agents claude-code,codex:gpt-5.5,opencode:openrouter/qwen/qwen3-coder
#
# Keys: `keys` lists the environment variables an agent can authenticate with.
# The agent runs when at least one is set in the shell, bench/.env, or the
# repository .env. Only the listed names are passed into the container.
#
# Egress: `egress` lists the hosts the agent may reach through the allowlist
# proxy. A leading dot matches subdomains. Nothing else is reachable.

[toolbox]
claude_code = "2.1.281"
codex = "0.156.1"
gemini_cli = "0.61.0"
opencode = "1.18.32"
mini_swe_agent = "2.4.6"

[agents.claude-code]
description = "Anthropic Claude Code CLI, headless (-p), permissions bypassed inside the sandbox"
model = "claude-opus-5-5"
keys = ["ANTHROPIC_API_KEY", "CLAUDE_CODE_OAUTH_TOKEN"]
egress = ["api.anthropic.com", "statsig.anthropic.com", ".anthropic.com", ".claude.ai"]

[agents.codex]
description = "OpenAI Codex CLI, codex exec with approvals and sandbox bypassed inside the container"
model = ""  # empty = the CLI's default model
keys = ["OPENAI_API_KEY"]
egress = ["api.openai.com", ".openai.com", "chatgpt.com", ".chatgpt.com"]

[agents.gemini-cli]
description = "Google Gemini CLI, headless (-p) with --yolo"
model = ""  # empty = the CLI's default model
keys = ["GEMINI_API_KEY"]
egress = ["generativelanguage.googleapis.com", ".googleapis.com", "play.googleapis.com"]

[agents.opencode]
description = "OpenCode CLI (opencode run --auto); MODEL is provider/model, e.g. anthropic/claude-sonnet-5"
model = "anthropic/claude-sonnet-5"
keys = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "GEMINI_API_KEY", "OPENROUTER_API_KEY"]
egress = ["api.anthropic.com", "api.openai.com", "generativelanguage.googleapis.com", "openrouter.ai", ".openrouter.ai", "models.dev", "models.opencode.ai"]

[agents.mini-swe-agent]
description = "mini-SWE-agent: bash-only reference agent over LiteLLM; MODEL is a LiteLLM model name"
model = "anthropic/claude-sonnet-5"
keys = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "GEMINI_API_KEY", "OPENROUTER_API_KEY"]
egress = ["api.anthropic.com", "api.openai.com", "generativelanguage.googleapis.com", "openrouter.ai", ".openrouter.ai"]

# Built-in controls. They need no keys and no network.
[agents.oracle]
description = "Applies the task's gold patch and writes the expected verdict (harness self-test, must score 100%)"
builtin = true

[agents.noop]
description = "Changes nothing and writes no verdict (harness self-test, must resolve 0 bug tasks)"
builtin = true
