schema_version = 1
[llm_clients.g]
format = "openai_chat"
base_url = "http://127.0.0.1:19340/v1"
api_key_env = "OPENAI_API_KEY"
# live_real.py injects extra_headers.x-goog-api-key from GEMINI_API_KEY
# Do not put a live Google key in this committed file.
[targets.cap]
id = "gemini-hunt"
llm_client = "g"
[routes.primary]
id = "gemini-hunt"
type = "passthrough"
target = "cap"
