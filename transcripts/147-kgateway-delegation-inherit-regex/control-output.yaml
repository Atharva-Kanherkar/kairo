Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 80
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        httpFilters:
        - name: envoy.filters.http.rbac
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~80
        statPrefix: http_80
        useRemoteAddress: true
    name: listener~80
  name: listener~80
Routes:
- ignorePortInHostMatching: true
  name: listener~80
  virtualHosts:
  - domains:
    - example.com
    name: listener~80~example_com
    routes:
    - directResponse:
        body:
          inlineString: invalid route configuration detected and replaced with a direct
            response.
        status: 500
      match:
        pathSeparatedPrefix: /team1
      name: listener~80~example_com-route-0-httproute-zz-parent-infra-0-0-matcher-0
    - match:
        pathSeparatedPrefix: /admin
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            rbac:
            - gateway.kgateway.dev/TrafficPolicy/infra/zz-admin-policy
      name: listener~80~example_com-route-1-httproute-zz-admin-infra-0-0-matcher-0
      route:
        cluster: kube_infra_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
      typedPerFilterConfig:
        envoy.filters.http.rbac:
          '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
          rbac:
            matcher:
              matcherList:
                matchers:
                - onMatch:
                    action:
                      name: envoy.filters.rbac.action
                      typedConfig:
                        '@type': type.googleapis.com/envoy.config.rbac.v3.Action
                        action: DENY
                        name: deny-request
                  predicate:
                    singlePredicate:
                      customMatch:
                        name: envoy.matching.matchers.cel_matcher
                        typedConfig:
                          '@type': type.googleapis.com/xds.type.matcher.v3.CelMatcher
                          exprMatch:
                            celExprParsed:
                              expr:
                                callExpr:
                                  args:
                                  - callExpr:
                                      args:
                                      - id: "2"
                                        selectExpr:
                                          field: headers
                                          operand:
                                            id: "1"
                                            identExpr:
                                              name: request
                                      - constExpr:
                                          stringValue: x-block
                                        id: "4"
                                      function: _[_]
                                    id: "3"
                                  - constExpr:
                                      stringValue: "true"
                                    id: "6"
                                  function: _==_
                                id: "5"
                              sourceInfo:
                                lineOffsets:
                                - 37
                                location: <input>
                                positions:
                                  "1": 0
                                  "2": 7
                                  "3": 15
                                  "4": 16
                                  "5": 27
                                  "6": 30
                      input:
                        name: envoy.matching.inputs.cel_data_input
                        typedConfig:
                          '@type': type.googleapis.com/xds.type.matcher.v3.HttpAttributesCelMatchInput
              onNoMatch:
                action:
                  name: action
                  typedConfig:
                    '@type': type.googleapis.com/envoy.config.rbac.v3.Action
                    name: allow-request
