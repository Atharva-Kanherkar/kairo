name: Refresh readme counts

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: readme-counts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh README counts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: recount bugs and tests
        run: python3 tools/update-readme-counts.py
      - name: commit if the counter moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md issues/SCOREBOARD.md
          if git diff --cached --quiet; then
            echo "README counts already current"
            exit 0
          fi
          git commit -m "refresh readme counts"
          git push
