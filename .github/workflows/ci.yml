name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  readme-counts:
    name: Readme counts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reproduction and count-guard regression tests
        run: |
          python3 -m unittest discover -s transcripts/071 -p 'test*.py'
          python3 -O -m unittest discover -s transcripts/071 -p 'test*.py'
          python3 -m unittest discover -s tools -p 'test*readme*.py'
      - name: README Status matches the issue and test counters
        run: python3 tools/update-readme-counts.py --check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (warnings denied, pedantic)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: unit tests
        run: cargo test --workspace --lib --locked --verbose
      - name: conformance and all other integration tests
        run: cargo test --workspace --tests --locked --verbose -- --nocapture
      - name: doc tests
        run: cargo test --workspace --doc --locked --verbose

  docs:
    name: Docs
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc
        run: cargo doc --workspace --no-deps --document-private-items
