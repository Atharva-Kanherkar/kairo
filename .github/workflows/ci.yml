name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: fmt + clippy + conformance + doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (all targets, warnings denied, pedantic)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # --lib: unit tests next to the checkers (src/)
      # --tests: every integration file under tests/, including conformance.rs
      #          and any future tests/*.rs added later. No CI edit required.
      # --doc: rustdoc examples
      - name: unit tests
        run: cargo test --workspace --lib --locked --verbose

      - name: conformance and all other integration tests
        run: cargo test --workspace --tests --locked --verbose -- --nocapture

      - name: doc tests
        run: cargo test --workspace --doc --locked --verbose

      - name: doc
        run: cargo doc --workspace --no-deps --document-private-items
